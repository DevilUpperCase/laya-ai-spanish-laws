services:
  scanner:
    image: clamav/clamav@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6
    ports: ["127.0.0.1:13310:3310"]
    volumes: ["clamav-signatures:/var/lib/clamav"]
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  tls:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy-local-data:/data
      - caddy-local-config:/config
    networks: [private]
    restart: unless-stopped
volumes:
  clamav-signatures:
  caddy-local-data:
  caddy-local-config:
